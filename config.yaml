# Options & Settings for JIT Defect Prediction Pipeline

# File types you want to consider when processing
file_type:
  - ".cpp"
  - ".cc"
  - ".c"
  - ".hpp"
  - ".h"

# Exclusion directories
exclude_dirs:
  - "tests/"
  - "docs/"
  - "third_party/"

# Keywords used to detect bug-fixing commits
szz_keywords:
  - "fix"
  - "bug"
  - "issue"
  - "patch"
  - "resolve"
  - "close"


# Enable or disable specific feature extraction groups
developer_metrics:
  recentDays: 90          # For rexp calculation
  recentCommitsDays: 30   # For RecentCommits metric
process_metrics:
  timeWindowDays: 30      # For recentCommits in process metrics
features:
  extract_developer_metrics: true
  extract_change_metrics: true
  extract_process_metrics: false
  ignore_merge_commits: true
  ignore_bot_commits: true